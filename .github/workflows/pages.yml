# Test su ogni pull request; su main, dopo i test, pubblica solo dist/quiz.html (come index.html) su GitHub Pages.
name: Test e pubblicazione

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4   # release con le correzioni di sicurezza (Brotli)
          cache: npm
      - run: npm ci
      - run: npm test   # genera dist/quiz.html ed esegue tests/smoke.js
      - name: Prepara il sito (solo index.html)
        if: github.event_name != 'pull_request'
        run: mkdir _site && cp dist/quiz.html _site/index.html
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
